name: ufo-portal
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/ufo_portal?connectionTimeZone=UTC
      DATABASE_USERNAME: ufo
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      USER_SESSION_SECONDS: ${USER_SESSION_SECONDS:-28800}
      MONITORING_CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MONITORING_API_KEY: ${MONITORING_API_KEY:-}
      MONITORING_TICK_MS: ${MONITORING_TICK_MS:-30000}
      MONITORING_STALE_SECONDS: ${MONITORING_STALE_SECONDS:-180}
      OMADA_BASE_URL: ${OMADA_BASE_URL:-https://euw1-omada-northbound.tplinkcloud.com}
      OMADA_CONTROLLER_ID: ${OMADA_CONTROLLER_ID:?Set OMADA_CONTROLLER_ID}
      OMADA_CLIENT_ID: ${OMADA_CLIENT_ID:?Set OMADA_CLIENT_ID}
      OMADA_CLIENT_SECRET: ${OMADA_CLIENT_SECRET:?Set OMADA_CLIENT_SECRET}
      OMADA_SITE_ID: ${OMADA_SITE_ID:-}
      OMADA_SITE_NAME: ${OMADA_SITE_NAME:-UFO Location}
      OMADA_DEVICES_PATH: /openapi/v1/{omadacId}/sites/{siteId}/devices
      OMADA_STATE_FIELD: ${OMADA_STATE_FIELD:-status}
      OMADA_CONNECTED_VALUE: ${OMADA_CONNECTED_VALUE:-1}
      OMADA_DISCONNECTED_VALUE: ${OMADA_DISCONNECTED_VALUE:-0}
      OMADA_REBOOT_PATH: /openapi/v1/{omadacId}/sites/{siteId}/devices/{deviceMac}/reboot
      OMADA_REBOOT_METHOD: ${OMADA_REBOOT_METHOD:-POST}
      NOTIFICATION_DELIVERY_URL: ${NOTIFICATION_DELIVERY_URL:-}
      NOTIFICATION_DELIVERY_TOKEN: ${NOTIFICATION_DELIVERY_TOKEN:-}
    networks:
      - application
      - database-access
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ufo_portal
      MYSQL_USER: ufo
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./data/mysql}
        target: /var/lib/mysql
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks:
      - database-access
networks:
  application:
  database-access:
  database:
    internal: true
